[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read-write", path = "./" }]



remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/"
]

[rpc_endpoints]
alchemy = "https://monad-testnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
monad_testnet = "https://testnet-rpc.monad.xyz"
ankr = "https://rpc.ankr.com/monad_testnet"

# Monad testnet chain configuration
[etherscan]
monad_testnet = { key = "${MONADSCAN_API_KEY}", url = "https://testnet.monadscan.com/api" }
