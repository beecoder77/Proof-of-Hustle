<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181B26"/>
      <stop offset="50%" stop-color="#11131A"/>
      <stop offset="100%" stop-color="#0B0C10"/>
    </linearGradient>

    <!-- Monad Iris Gradient -->
    <linearGradient id="irisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9073FD"/>
      <stop offset="50%" stop-color="#7C5CFC"/>
      <stop offset="100%" stop-color="#5B36F5"/>
    </linearGradient>

    <!-- Emerald Glow Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Inner Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C5CFC" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Subtle Ambient Glow Behind Icon -->
  <circle cx="256" cy="256" r="140" fill="#7C5CFC" opacity="0.18" filter="url(#glow)"/>

  <!-- Stylized Hustle Emblem ("P" & "H" Fusion + Lightning Bolt) -->
  <g transform="translate(0, 0)">
    <!-- Main Left Pillar (Stem of P and H) -->
    <path d="M 148 136 
             C 148 127.16 155.16 120 164 120 
             L 196 120 
             C 204.84 120 212 127.16 212 136 
             L 212 376 
             C 212 384.84 204.84 392 196 392 
             L 164 392 
             C 155.16 392 148 384.84 148 376 
             Z" 
          fill="url(#irisGrad)"/>

    <!-- The "P" Loop (Upper Arc) -->
    <path d="M 212 120 
             L 300 120 
             C 346.39 120 384 157.61 384 204 
             C 384 250.39 346.39 288 300 288 
             L 212 288 
             Z 
             M 212 176 
             L 292 176 
             C 307.46 176 320 188.54 320 204 
             C 320 219.46 307.46 232 292 232 
             L 212 232 
             Z" 
          fill="url(#irisGrad)"/>

    <!-- Lightning Bolt / Hustle Speed Angle across H -->
    <path d="M 248 244 
             L 348 244 
             L 288 384 
             C 285.5 389.8 277.8 391.2 273.5 386.4 
             L 236 344 
             L 272 344 
             L 248 244 
             Z" 
          fill="url(#emeraldGrad)" 
          filter="url(#glow)"/>

    <!-- Right Pillar of "H" (Lower Half) -->
    <path d="M 332 280 
             L 364 280 
             C 372.84 280 380 287.16 380 296 
             L 380 376 
             C 380 384.84 372.84 392 364 392 
             L 332 392 
             C 323.16 392 316 384.84 316 376 
             L 316 296 
             C 316 287.16 323.16 280 332 280 
             Z" 
          fill="url(#irisGrad)"/>

    <!-- Accent Spark (Monad Fast Finality Indicator) -->
    <circle cx="396" cy="136" r="14" fill="#34D399" filter="url(#glow)"/>
  </g>
</svg>
